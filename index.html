<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WONGPHRARAM DIGITAL</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .card { background: white; width: 100%; max-width: 450px; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e40af; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #374151; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    button { padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-in { background-color: #16a34a; }
    .btn-out { background-color: #dc2626; }
    .time-board { background: #eff6ff; padding: 12px; border-radius: 8px; margin-top: 15px; }
    .time-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #cbd5e1; }
    .time-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>ลงเวลาทำงาน (WONGPHRARAM)</h2>
  
  <div class="form-group">
    <label for="empName">ชื่อพนักงาน:</label>
    <input type="text" id="empName" placeholder="กรอกชื่อ-นามสกุล">
  </div>

  <div class="btn-grid">
    <button type="button" id="btnIn" class="btn-in" onclick="sendData('IN')">บันทึกเข้างาน</button>
    <button type="button" id="btnOut" class="btn-out" onclick="sendData('OUT')">บันทึกออกงาน</button>
  </div>

  <div class="time-board">
    <div style="font-weight:bold; margin-bottom:8px; color:#1d4ed8;">เวลาบันทึกวันนี้:</div>
    <div class="time-row"><span>เข้าเช้า (D):</span> <b id="tD">--:--</b></div>
    <div class="time-row"><span>ออกเที่ยง (E):</span> <b id="tE">--:--</b></div>
    <div class="time-row"><span>เข้าบ่าย (F):</span> <b id="tF">--:--</b></div>
    <div class="time-row"><span>ออกบ่าย (G):</span> <b id="tG">--:--</b></div>
    <div class="time-row"><span>เข้า OT (H):</span> <b id="tH">--:--</b></div>
    <div class="time-row"><span>ออก OT (I):</span> <b id="tI">--:--</b></div>
    <div style="text-align: center; margin-top: 15px;">
      <a href="admin.html" style="color: #6b7280; text-decoration: none; font-size: 13px;">🔑 สำหรับผู้ดูแลระบบ (Admin)</a>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyActwKRKdMCIRo79apLXwwsw8zuHPCg9ag",
    authDomain: "wongpraram-v8.firebaseapp.com",
    projectId: "wongpraram-v8",
    storageBucket: "wongpraram-v8.firebasestorage.app",
    messagingSenderId: "406006018362",
    appId: "1:406006018362:web:7c5d7f99fccda593e56003",
    measurementId: "G-5D1SF6VPIN"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let deviceId = localStorage.getItem("deviceId");
  if (!deviceId) {
    deviceId = "DEV-" + Math.floor(Math.random() * 1000000);
    localStorage.setItem("deviceId", deviceId);
  }

  // ใช้เวลาท้องถิ่น (Local Date) เพื่อป้องกันปัญหาวันที่คลาดเคลื่อนช่วง 00:00 - 07:00 น.
  const localNow = new Date();
  const todayStr = localNow.getFullYear() + "-" + 
                   String(localNow.getMonth() + 1).padStart(2, '0') + "-" + 
                   String(localNow.getDate()).padStart(2, '0');
  const docId = todayStr + "_" + deviceId;

  // ตัวแปรเก็บข้อมูลล่าสุดของวันนี้จาก Firestore เพื่อใช้อ้างอิงและตรวจสอบการซ้ำ
  let currentRecord = {};

  window.onload = function() {
    let lastName = localStorage.getItem("lastEmpName") || "";
    if (lastName) document.getElementById("empName").value = lastName;

    db.collection("attendance").doc(docId).onSnapshot(function(doc) {
      if (doc.exists) {
        currentRecord = doc.data();
        if (currentRecord.empName) document.getElementById("empName").value = currentRecord.empName;
        document.getElementById("tD").innerText = currentRecord.inMorning || "--:--";
        document.getElementById("tE").innerText = currentRecord.outNoon || "--:--";
        document.getElementById("tF").innerText = currentRecord.inAfternoon || "--:--";
        document.getElementById("tG").innerText = currentRecord.outEvening || "--:--";
        document.getElementById("tH").innerText = currentRecord.inOT || "--:--";
        document.getElementById("tI").innerText = currentRecord.outOT || "--:--";
      }
    });
  };

  function sendData(type) {
    var nameInput = document.getElementById("empName").value.trim();
    if (!nameInput) {
      alert("กรุณากรอกชื่อก่อนกดบันทึกครับ");
      return;
    }

    const now = new Date();
    const hour = now.getHours() + (now.getMinutes() / 60);

    // 1. ตรวจสอบ Cooldown 3 นาที (กันกดรัวหรือกดปุ่มผิดสลับกันติดๆ)
    if (currentRecord.lastActionMs) {
      const diffMinutes = (now.getTime() - currentRecord.lastActionMs) / (1000 * 60);
      if (diffMinutes < 3) {
        const waitMins = Math.ceil(3 - diffMinutes);
        alert("คุณเพิ่งทำรายการบันทึกเวลาไปเมื่อสักครู่ กรุณารออีกประมาณ " + waitMins + " นาทีครับ");
        return;
      }
    }

    // 2. ตรวจสอบว่าช่องเวลานั้นๆ เคยบันทึกไปแล้วหรือยัง
    let targetField = "";
    let slotName = "";

    if (type === 'IN') {
      if (hour < 12) { targetField = "inMorning"; slotName = "เข้าเช้า (D)"; }
      else if (hour < 16) { targetField = "inAfternoon"; slotName = "เข้าบ่าย (F)"; }
      else { targetField = "inOT"; slotName = "เข้า OT (H)"; }
    } else {
      if (hour < 13.5) { targetField = "outNoon"; slotName = "ออกเที่ยง (E)"; }
      else if (hour < 18.5) { targetField = "outEvening"; slotName = "ออกบ่าย (G)"; }
      else { targetField = "outOT"; slotName = "ออก OT (I)"; }
    }

    // ถ้ามีข้อมูลเวลาในช่องนั้นอยู่แล้ว ให้บล็อกและแจ้งเตือนทันที
    if (currentRecord[targetField]) {
      alert("ไม่สามารถบันทึกซ้ำได้ เนื่องจากคุณได้ลงเวลา \"" + slotName + "\" ไปแล้วเมื่อเวลา " + currentRecord[targetField] + " น.");
      return;
    }

    localStorage.setItem("lastEmpName", nameInput);
    toggleButtons(true);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(pos) { doRecord(targetField, slotName, pos.coords.latitude, pos.coords.longitude); },
        function(err) { doRecord(targetField, slotName, 0, 0); },
        { timeout: 3000 }
      );
    } else {
      doRecord(targetField, slotName, 0, 0);
    }
  }

  function doRecord(targetField, slotName, lat, lng) {
    const name = document.getElementById("empName").value.trim();
    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');

    let updateData = { 
      empName: name, 
      deviceId: deviceId, 
      date: todayStr,
      lastActionMs: now.getTime(), // เก็บเวลาที่กดล่าสุดไว้เช็ก Cooldown
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    // บันทึกเวลาลงเฉพาะช่องที่ตรวจสอบแล้วว่ายังว่างอยู่
    updateData[targetField] = timeStr;

    if (lat !== 0 && lng !== 0) {
      updateData.lat = lat;
      updateData.lng = lng;
    }

    db.collection("attendance").doc(docId).set(updateData, { merge: true })
      .then(function() {
        toggleButtons(false);
        alert("บันทึก " + slotName + " เวลา " + timeStr + " น. สำเร็จ!");
      })
      .catch(function(err) {
        toggleButtons(false);
        alert("เกิดข้อผิดพลาด: " + err.message);
      });
  }

  function toggleButtons(disabled) {
    document.getElementById("btnIn").disabled = disabled;
    document.getElementById("btnOut").disabled = disabled;
  }
</script>

</body>
</html>
