<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard - ระบบลงเวลาพนักงาน</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- Library สำหรับ Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    /* Login Screen */
    .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    .login-box h2 { color: #1e3a8a; margin-top: 0; }
    .login-input { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 15px 0; text-align: center; letter-spacing: 2px; }
    
    /* Buttons */
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: #2563eb; color: white; width: 100%; font-size: 16px; padding: 12px; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-edit { background: #f59e0b; color: white; padding: 6px 12px; font-size: 13px; }
    .btn-edit:hover { background: #d97706; }

    /* Header & Filter */
    .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header-bar h2 { margin: 0; color: #1e3a8a; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type="month"], select, input[type="text"], input[type="date"], input[type="time"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }

    /* Table */
    .table-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background: #f8fafc; color: #475569; font-weight: bold; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-in { background: #dcfce7; color: #166534; }
    .badge-out { background: #fee2e2; color: #991b1b; }
    .note-text { color: #b45309; font-size: 13px; background: #fef3c7; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }

    /* Modal Popup สำหรับแก้ไขเวลา */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-box { background: white; width: 100%; max-width: 450px; border-radius: 14px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-box h3 { margin-top: 0; color: #1e3a8a; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #334155; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

<!-- ส่วนหน้าจอล็อกอิน -->
<div id="loginSection" class="login-box">
  <h2>🔐 เข้าสู่ระบบ Admin</h2>
  <p style="color: #64748b; font-size: 14px;">กรุณากรอกรหัสผ่านเพื่อจัดการเวลาพนักงาน</p>
  <input type="password" id="adminPass" class="login-input" placeholder="กรอกรหัสผ่าน" onkeypress="if(event.key==='Enter') checkLogin()">
  <button class="btn btn-primary" onclick="checkLogin()">เข้าสู่ระบบ</button>
  <div id="loginError" style="color: #dc2626; margin-top: 10px; font-size: 14px; display: none;">❌ รหัสผ่านไม่ถูกต้อง</div>
</div>

<!-- ส่วนเนื้อหาหลัก Admin -->
<div id="adminDashboard" class="container" style="display: none;">
  <div class="header-bar">
    <div>
      <h2>📊 ระบบจัดการเวลาเข้า-ออกพนักงาน</h2>
      <span style="font-size: 13px; color: #64748b;">WONGPHRARAM DIGITAL</span>
    </div>
    <div class="controls">
      <input type="month" id="monthFilter" onchange="loadData()">
      <input type="text" id="searchName" placeholder="ค้นหาชื่อพนักงาน..." onkeyup="filterTable()">
      <button class="btn btn-success" onclick="exportToExcel()">📥 Export Excel</button>
      <button class="btn btn-danger" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>

  <div class="table-card">
    <table id="attendanceTable">
      <thead>
        <tr>
          <th>วันที่</th>
          <th>เวลา</th>
          <th>ชื่อพนักงาน</th>
          <th>สถานะ</th>
          <th>พิกัด / หมายเหตุ</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- หน้าต่างป๊อบอัปแก้ไขเวลา -->
<div id="editModal" class="modal-overlay">
  <div class="modal-box">
    <h3>✏️ แก้ไขบันทึกเวลาพนักงาน</h3>
    <input type="hidden" id="editDocId">
    
    <div class="form-group">
      <label>ชื่อพนักงาน</label>
      <input type="text" id="editName" readonly style="background: #f8fafc; color: #64748b;">
    </div>

    <div class="form-group">
      <label>เลือกวันที่ใหม่</label>
      <input type="date" id="editDate">
    </div>

    <div class="form-group">
      <label>เลือกเวลาใหม่</label>
      <input type="time" id="editTime" step="1">
    </div>

    <div class="form-group">
      <label>ประเภทการลงเวลา</label>
      <select id="editType">
        <option value="เข้างาน">เข้างาน</option>
        <option value="ออกงาน">ออกงาน</option>
      </select>
    </div>

    <div class="form-group">
      <label>หมายเหตุการแก้ไข (เช่น ลืมสแกน, ออกไปธุระ, เครื่องมีปัญหา)</label>
      <textarea id="editNote" rows="3" placeholder="ระบุเหตุผลที่แก้ไขเวลา..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn" style="background: #e2e8f0; color: #334155;" onclick="closeEditModal()">ยกเลิก</button>
      <button class="btn btn-primary" style="width: auto;" onclick="saveEdit()">💾 บันทึกการแก้ไข</button>
    </div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyActwKRKdMCIRo79apLXwwsw8zuHPCg9ag",
    authDomain: "wongpraram-v8.firebaseapp.com",
    projectId: "wongpraram-v8",
    storageBucket: "wongpraram-v8.firebasestorage.app",
    messagingSenderId: "406006018362",
    appId: "1:406006018362:web:7c5d7f99fccda593e56003"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const ADMIN_PASSWORD = "0878061468";
  let allRecords = [];

  // ตั้งค่าเดือนปัจจุบันเป็นค่าเริ่มต้น
  const now = new Date();
  document.getElementById("monthFilter").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

  // ตรวจสอบสถานะการล็อกอินเมื่อเปิดหน้าเว็บ
  window.onload = function() {
    if (sessionStorage.getItem("admin_logged_in") === "true") {
      showDashboard();
    }
  };

  function checkLogin() {
    const pass = document.getElementById("adminPass").value;
    if (pass === ADMIN_PASSWORD) {
      sessionStorage.setItem("admin_logged_in", "true");
      document.getElementById("loginError").style.display = "none";
      showDashboard();
    } else {
      document.getElementById("loginError").style.display = "block";
    }
  }

  function logout() {
    sessionStorage.removeItem("admin_logged_in");
    document.getElementById("adminDashboard").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("adminPass").value = "";
  }

  function showDashboard() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("adminDashboard").style.display = "block";
    loadData();
  }

  // โหลดข้อมูลจาก Firebase
  function loadData() {
    const selectedMonth = document.getElementById("monthFilter").value; // รูปแบบ YYYY-MM
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

    db.collection("attendance").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
      allRecords = [];
      snapshot.forEach((doc) => {
        const data = doc.data();
        let dateObj = data.timestamp ? data.timestamp.toDate() : new Date();
        
        // แปลงวันที่เป็น YYYY-MM-DD เพื่อกรองและใช้ใน input date
        const yyyy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        const dateStr = `${yyyy}-${mm}-${dd}`;
        const timeStr = dateObj.toTimeString().split(' ')[0]; // HH:MM:SS

        if (!selectedMonth || dateStr.startsWith(selectedMonth)) {
          allRecords.push({
            id: doc.id,
            name: data.name || data.employeeName || "ไม่ระบุชื่อ",
            type: data.type || data.status || "เข้างาน",
            dateStr: dateStr,
            displayDate: `${dd}/${mm}/${yyyy + 543}`,
            timeStr: timeStr,
            location: data.location || data.lat ? `https://maps.google.com/?q=${data.lat},${data.lng}` : "-",
            note: data.note || ""
          });
        }
      });
      renderTable(allRecords);
    });
  }

  function renderTable(records) {
    const tbody = document.getElementById("tableBody");
    if (records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#64748b;">ไม่พบข้อมูลการลงเวลาในเดือนที่เลือก</td></tr>';
      return;
    }

    tbody.innerHTML = "";
    records.forEach((rec) => {
      const badgeClass = rec.type.includes("ออก") ? "badge-out" : "badge-in";
      const mapLink = rec.location.startsWith("http") ? `<a href="${rec.location}" target="_blank">📍 ดูแผนที่</a>` : rec.location;
      const noteHtml = rec.note ? `<br><span class="note-text">📝 ${rec.note}</span>` : "";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${rec.displayDate}</td>
        <td><strong>${rec.timeStr}</strong></td>
        <td>${rec.name}</td>
        <td><span class="badge ${badgeClass}">${rec.type}</span></td>
        <td>${mapLink}${noteHtml}</td>
        <td>
          <button class="btn btn-edit" onclick="openEditModal('${rec.id}')">✏️ แก้ไข</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function filterTable() {
    const keyword = document.getElementById("searchName").value.toLowerCase();
    const filtered = allRecords.filter(r => r.name.toLowerCase().includes(keyword));
    renderTable(filtered);
  }

  // เปิด Modal แก้ไข
  function openEditModal(docId) {
    const record = allRecords.find(r => r.id === docId);
    if (!record) return;

    document.getElementById("editDocId").value = record.id;
    document.getElementById("editName").value = record.name;
    document.getElementById("editDate").value = record.dateStr;
    document.getElementById("editTime").value = record.timeStr;
    document.getElementById("editType").value = record.type.includes("ออก") ? "ออกงาน" : "เข้างาน";
    document.getElementById("editNote").value = record.note;

    document.getElementById("editModal").style.display = "flex";
  }

  function closeEditModal() {
    document.getElementById("editModal").style.display = "none";
  }

  // บันทึกการแก้ไขลง Firebase
  async function saveEdit() {
    const docId = document.getElementById("editDocId").value;
    const newDate = document.getElementById("editDate").value; // YYYY-MM-DD
    const newTime = document.getElementById("editTime").value; // HH:MM หรือ HH:MM:SS
    const newType = document.getElementById("editType").value;
    const newNote = document.getElementById("editNote").value.trim();

    if (!newDate || !newTime) {
      alert("กรุณาเลือกวันที่และเวลาให้ครบถ้วนครับ");
      return;
    }

    // รวมวันและเวลาเป็น Date Object ใหม่
    const fullTime = newTime.length === 5 ? `${newTime}:00` : newTime;
    const updatedDateObj = new Date(`${newDate}T${fullTime}`);

    try {
      await db.collection("attendance").doc(docId).update({
        timestamp: firebase.firestore.Timestamp.fromDate(updatedDateObj),
        type: newType,
        status: newType,
        note: newNote || "แก้ไขเวลาโดย Admin"
      });

      alert("✅ บันทึกการแก้ไขเวลาเรียบร้อยแล้ว!");
      closeEditModal();
    } catch (error) {
      alert("❌ เกิดข้อผิดพลาดในการบันทึก: " + error.message);
    }
  }

  // Export ไฟล์ Excel พร้อมช่องหมายเหตุ
  function exportToExcel() {
    if (allRecords.length === 0) {
      alert("ไม่มีข้อมูลสำหรับส่งออกครับ");
      return;
    }

    const excelData = allRecords.map(r => ({
      "วันที่": r.displayDate,
      "เวลา": r.timeStr,
      "ชื่อพนักงาน": r.name,
      "สถานะ": r.type,
      "หมายเหตุ": r.note,
      "ลิงก์พิกัด GPS": r.location
    }));

    const ws = XLSX.utils.json_to_sheet(excelData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Attendance");
    
    const monthVal = document.getElementById("monthFilter").value || "All";
    XLSX.writeFile(wb, `รายงานลงเวลา_${monthVal}.xlsx`);
  }
</script>

</body>
</html>
