<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound System Player (เครื่องเล่นเสียง)</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 40px 20px; margin: 0; }
    .status-box { background: #1e293b; border-radius: 16px; padding: 30px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 25px rgba(0,0,0,0.5); }
    .btn-ready { background: #22c55e; color: white; border: none; padding: 16px 32px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-bottom: 20px; transition: 0.2s; width: 100%; }
    .btn-ready:hover { background: #16a34a; }
    .now-playing { font-size: 20px; color: #38bdf8; font-weight: bold; margin-top: 15px; word-break: break-all; }
    .mic-live { color: #ef4444; font-size: 24px; font-weight: bold; animation: blink 1s infinite; margin-top: 15px; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="status-box">
  <h2>🔊 เครื่องกระจายเสียง (PA Player)</h2>
  <p style="color: #94a3b8;">เปิดหน้านี้ทิ้งไว้บนเครื่องคอมพิวเตอร์ที่ต่อระบบเสียงตามสาย</p>
  
  <button id="btnInit" class="btn-ready" onclick="enableAudio()">คลิกที่นี่ 1 ครั้ง เพื่อเปิดระบบเสียง</button>
  
  <div id="statusText" style="color: #e2e8f0; font-weight: bold;">⏳ รอปลดล็อกระบบเสียง...</div>
  <div id="nowPlaying" class="now-playing">--- สภาวะ: ปิดเสียง ---</div>

  <audio id="audioPlayer"></audio>
  <audio id="remoteAudio" autoplay></audio>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyActwKRKdMCIRo79apLXwwsw8zuHPCg9ag",
    authDomain: "wongpraram-v8.firebaseapp.com",
    projectId: "wongpraram-v8",
    storageBucket: "wongpraram-v8.firebasestorage.app",
    messagingSenderId: "406006018362",
    appId: "1:406006018362:web:7c5d7f99fccda593e56003"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const audio = document.getElementById("audioPlayer");
  const remoteAudio = document.getElementById("remoteAudio");
  let isAudioEnabled = false;

  let peerConnection;
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function enableAudio() {
    audio.play().then(() => audio.pause()).catch(() => {});
    remoteAudio.play().then(() => remoteAudio.pause()).catch(() => {});
    isAudioEnabled = true;
    document.getElementById("btnInit").style.display = "none";
    document.getElementById("statusText").innerText = "🟢 ระบบพร้อมรับคำสั่งเสียงและไมค์พูดสดแล้ว";
    document.getElementById("statusText").style.color = "#4ade80";
  }

  // ระบบ WebRTC รับสัญญาณไมค์สด
  async function initWebRTC() {
    peerConnection = new RTCPeerConnection(rtcConfig);

    peerConnection.ontrack = (event) => {
      remoteAudio.srcObject = event.streams[0];
      remoteAudio.play();
      document.getElementById("nowPlaying").className = "mic-live";
      document.getElementById("nowPlaying").innerText = "🎙️ 🔴 กำลังประกาศสดจากไมโครโฟน...";
    };

    const callDoc = db.collection("webrtc_calls").doc("live");
    const answerCandidates = callDoc.collection("answerCandidates");
    const offerCandidates = callDoc.collection("offerCandidates");

    peerConnection.onicecandidate = (event) => {
      if (event.candidate) {
        answerCandidates.add(event.candidate.toJSON());
      }
    };

    callDoc.onSnapshot(async (snapshot) => {
      const data = snapshot.data();
      if (!peerConnection.currentRemoteDescription && data?.offer) {
        // หยุดเพลง MP3 ถ้ากำลังเล่นอยู่ เพื่อให้เสียงไมค์ดังแทน
        audio.pause();
        const offerDescription = new RTCSessionDescription(data.offer);
        await peerConnection.setRemoteDescription(offerDescription);

        const answerDescription = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answerDescription);

        const answer = {
          type: answerDescription.type,
          sdp: answerDescription.sdp,
        };

        await callDoc.update({ answer });
      } else if (!data?.offer) {
        if (peerConnection) {
          document.getElementById("nowPlaying").className = "now-playing";
          document.getElementById("nowPlaying").innerText = "⏹️ จบการประกาศสด";
        }
      }
    });

    offerCandidates.onSnapshot((snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          let data = change.doc.data();
          peerConnection.addIceCandidate(new RTCIceCandidate(data));
        }
      });
    });
  }

  initWebRTC();

  // ฟังคำสั่งเล่นไฟล์ MP3 ปกติ
  db.collection("sound_control").doc("current").onSnapshot((doc) => {
    if (!doc.exists || !isAudioEnabled) return;
    const data = doc.data();

    if (data.action === "PLAY") {
      document.getElementById("nowPlaying").className = "now-playing";
      document.getElementById("nowPlaying").innerText = "🎶 กำลังโหลด: " + (data.title || "");
      if (data.url) {
        audio.src = data.url;
        audio.load();
        audio.play().then(() => {
          document.getElementById("nowPlaying").innerText = "🔊 กำลังเล่น: " + data.title;
        }).catch(err => console.log(err));
      }
    } else if (data.action === "STOP") {
      audio.pause();
      audio.currentTime = 0;
      document.getElementById("nowPlaying").className = "now-playing";
      document.getElementById("nowPlaying").innerText = "⏹️ หยุดเล่นเสียงแล้ว";
    }
  });
</script>

</body>
</html>
